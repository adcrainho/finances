<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finances</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f6fb; color: #172033; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
    h1 { margin: 0 0 6px; font-size: 2rem; }
    p { margin: 0 0 28px; color: #667085; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    a.tile { display: block; padding: 20px; border: 1px solid rgba(23,32,51,.08); border-radius: 16px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 10px 30px rgba(23,32,51,.08); transition: 140ms ease; }
    a.tile:hover { transform: translateY(-2px); border-color: #1c69d4; }
    .tile strong { display: block; margin-bottom: 4px; font-size: 1.05rem; }
    .tile span { color: #667085; font-size: .88rem; }
  </style>
</head>
<body>
  <main>
    <h1>Finances</h1>
    <p>Personal finance tools, synced with OneDrive.</p>
    <div class="grid">
      <a class="tile" href="car-insurance/"><strong>🚗 Car Insurance</strong><span>BMW insurance account over time</span></a>
    </div>
  </main>
</body>
</html>
